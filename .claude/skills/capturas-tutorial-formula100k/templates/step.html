<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_tokens.css">
<style>
.step-wrap {
  max-width: 860px;
  width: 100%;
  background: #fff;
  border-radius: var(--r-card);
  box-shadow: var(--shadow-soft);
  overflow: hidden;
}
.step-header {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 28px 36px;
  background: var(--bg-cream-soft);
  border-bottom: 2px solid var(--gray-line);
}
.step-badge {
  flex-shrink: 0;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--coral);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
  color: #fff;
  box-shadow: var(--shadow-card);
}
.step-label {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--coral-dark);
  margin-bottom: 4px;
}
.step-title {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 26px;
  color: var(--ink);
  line-height: 1.2;
}
.step-body {
  padding: 24px 36px 28px;
  font-size: 19px;
  line-height: 1.55;
  color: var(--ink-soft);
}
.step-body strong { color: var(--ink); font-weight: 600; }
.step-body code {
  font-family: var(--font-mono);
  font-size: 17px;
  background: var(--gray-soft);
  padding: 2px 7px;
  border-radius: 5px;
  color: var(--ink);
}
</style>
</head>
<body data-bg="{{bg}}">
<div class="stage" data-bg="{{bg}}">
  <div class="step-wrap">
    <div class="step-header">
      <div class="step-badge">{{number}}</div>
      <div>
        <div class="step-label">Paso {{number}}</div>
        <div class="step-title">{{title}}</div>
      </div>
    </div>
    <div class="step-body">{{body}}</div>
  </div>
</div>
</body>
</html>
