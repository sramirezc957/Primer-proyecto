<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_tokens.css">
<style>
.callout {
  max-width: 860px;
  width: 100%;
  padding: 32px 36px;
  border-radius: var(--r-card);
  display: flex;
  align-items: flex-start;
  gap: 20px;
  border-left: 6px solid;
}
.callout[data-variant="success"] {
  background: var(--success-bg);
  border-color: var(--success);
}
.callout[data-variant="warning"] {
  background: var(--warning-bg);
  border-color: var(--warning);
}
.callout[data-variant="info"] {
  background: var(--info-bg);
  border-color: var(--info);
}
.callout[data-variant="error"] {
  background: var(--error-bg);
  border-color: var(--error);
}
.callout-icon {
  flex-shrink: 0;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  color: #fff;
}
.callout[data-variant="success"] .callout-icon { background: var(--success); }
.callout[data-variant="warning"] .callout-icon { background: var(--warning); }
.callout[data-variant="info"]    .callout-icon { background: var(--info); }
.callout[data-variant="error"]   .callout-icon { background: var(--error); }
.callout-content { flex: 1; }
.callout-title {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.7px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.callout[data-variant="success"] .callout-title { color: var(--success); }
.callout[data-variant="warning"] .callout-title { color: var(--warning); }
.callout[data-variant="info"]    .callout-title { color: var(--info); }
.callout[data-variant="error"]   .callout-title { color: var(--error); }
.callout-body {
  font-family: var(--font-body);
  font-size: 22px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--ink);
}
.callout-body strong { font-weight: 700; }
.callout-body code {
  font-family: var(--font-mono);
  font-size: 20px;
  background: rgba(0,0,0,0.06);
  padding: 2px 7px;
  border-radius: 5px;
}
</style>
</head>
<body data-bg="{{bg}}">
<div class="stage" data-bg="{{bg}}">
  <div class="callout" data-variant="{{variant}}">
    <div class="callout-icon">{{icon}}</div>
    <div class="callout-content">
      <div class="callout-title">{{label}}</div>
      <div class="callout-body">{{body}}</div>
    </div>
  </div>
</div>
</body>
</html>
