<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_tokens.css">
<style>
.link-card {
  width: 720px;
  background: #fff;
  border-radius: var(--r-card);
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: var(--shadow-soft);
  border: 1px solid var(--gray-line);
}
.link-icon {
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--bg-cream);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}
.link-url {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 19px;
  font-weight: 500;
  color: var(--ink);
  word-break: break-all;
}
.link-label {
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 2px;
}
.link-open {
  flex-shrink: 0;
  background: var(--coral-dark);
  color: #fff;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  padding: 10px 18px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.link-open svg { width: 14px; height: 14px; }
.link-label.hidden { display: none; }
</style>
</head>
<body data-bg="{{bg}}">
<div class="stage" data-bg="{{bg}}">
  <div class="link-card">
    <div class="link-icon">🌐</div>
    <div style="flex:1">
      <div class="link-label {{label_hidden}}">{{label}}</div>
      <div class="link-url">{{url}}</div>
    </div>
    <div class="link-open">
      Abrir
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H8M17 7v9"/></svg>
    </div>
  </div>
</div>
</body>
</html>
