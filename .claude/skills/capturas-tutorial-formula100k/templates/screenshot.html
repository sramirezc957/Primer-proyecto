<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_tokens.css">
<style>
.screenshot-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  max-width: 960px;
}
.window {
  border-radius: 14px;
  overflow: hidden;
  box-shadow: var(--shadow-soft);
  background: #fff;
}
.window[data-frame="mac"] .chrome {
  background: #F0EDE7;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid #D8D3C9;
}
.window[data-frame="mac"] .chrome .dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
}
.window[data-frame="mac"] .chrome .dot-r { background: #FF5F57; }
.window[data-frame="mac"] .chrome .dot-y { background: #FEBC2E; }
.window[data-frame="mac"] .chrome .dot-g { background: #28C840; }
.window[data-frame="mac"] .chrome .title {
  flex: 1;
  text-align: center;
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--ink-soft);
  font-weight: 500;
  margin-right: 52px;
}
.window[data-frame="browser"] .chrome {
  background: #F0EDE7;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.window[data-frame="browser"] .chrome .dot {
  width: 11px; height: 11px; border-radius: 50%;
}
.window[data-frame="browser"] .chrome .url-bar {
  flex: 1;
  background: #fff;
  border-radius: 6px;
  padding: 6px 12px;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--ink-soft);
}
.window img {
  display: block;
  max-width: 100%;
  width: 100%;
  height: auto;
}
.caption {
  font-family: var(--font-body);
  font-style: italic;
  font-size: 15px;
  color: var(--ink-soft);
  text-align: center;
  max-width: 720px;
  line-height: 1.4;
}
.caption.hidden { display: none; }
</style>
</head>
<body data-bg="{{bg}}">
<div class="stage" data-bg="{{bg}}">
  <div class="screenshot-wrap">
    <div class="window" data-frame="{{frame}}">
      <div class="chrome">
        <span class="dot dot-r"></span>
        <span class="dot dot-y"></span>
        <span class="dot dot-g"></span>
        <span class="title {{title_hidden}}">{{title}}</span>
        <div class="url-bar {{urlbar_hidden}}">{{url}}</div>
      </div>
      <img src="{{image}}" alt="">
    </div>
    <div class="caption {{caption_hidden}}">{{caption}}</div>
  </div>
</div>
</body>
</html>
