<title>La Hoja del Mes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;600&display=swap">
<style>
:root{
  --papel:#F4F3EF; --hoja:#FFFFFF; --tinta:#0B0B10; --tinta-2:#3A3A44; --tenue:#62626C;
  --pelo:#DEDCD4; --pelo-fuerte:#BEBBB0;
  --oro:#F0B24A; --oro-tinta:#7A4E05; --oro-fondo:#FBEBCB;
  --chatarra:#9E3524; --chatarra-fondo:#F6E1DC;
  --pasa:#1F6B45; --pasa-fondo:#DCEFE3;
  --gris-fondo:#ECEAE4;
  --sans:Geist,-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:Georgia,"Times New Roman",Times,serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papel:#050509; --hoja:#0B0B10; --tinta:#F4F1EA; --tinta-2:#D6D2C8; --tenue:#A1A1AA;
    --pelo:#24242E; --pelo-fuerte:#3F3F46;
    --oro:#F0B24A; --oro-tinta:#F0B24A; --oro-fondo:#2A2011;
    --chatarra:#F29A88; --chatarra-fondo:#2A1512;
    --pasa:#7FE3AD; --pasa-fondo:#0F2219;
    --gris-fondo:#16161D;
  }
}
:root[data-theme="dark"]{
  --papel:#050509; --hoja:#0B0B10; --tinta:#F4F1EA; --tinta-2:#D6D2C8; --tenue:#A1A1AA;
  --pelo:#24242E; --pelo-fuerte:#3F3F46;
  --oro:#F0B24A; --oro-tinta:#F0B24A; --oro-fondo:#2A2011;
  --chatarra:#F29A88; --chatarra-fondo:#2A1512;
  --pasa:#7FE3AD; --pasa-fondo:#0F2219;
  --gris-fondo:#16161D;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--sans);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:24px 64px}
.envoltura{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.ser{font-family:var(--serif);font-style:italic;font-weight:500;letter-spacing:-.5px}
.ceja{font-size:11.5px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--tenue)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}

/* ── barra de acciones ── */
.acciones{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.acciones .grupo{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--pelo-fuerte);background:transparent;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--tinta)}
.btn-oro{background:var(--oro);border-color:var(--oro);color:#050509}
.aviso{font-size:13px;color:var(--tenue);min-height:1.2em}

/* ── LA HOJA (página 1) ── */
.hoja{background:var(--hoja);border:1px solid var(--pelo);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:22px}
.cabeza{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;border-bottom:1px solid var(--pelo);padding-bottom:18px}
.cabeza h1{font-size:clamp(30px,4.4vw,48px);font-weight:800;letter-spacing:-2px;line-height:1.02}
.cabeza h1 .ser{font-weight:500}
.cabeza .meta{display:flex;flex-direction:column;gap:6px;align-items:flex-end;text-align:right;font-size:13px;color:var(--tinta-2)}
.pildora{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border:1px solid transparent;white-space:nowrap}
.p-pasa{background:var(--pasa-fondo);color:var(--pasa)}
.p-tapado{background:var(--chatarra-fondo);color:var(--chatarra)}
.p-gris{background:var(--gris-fondo);color:var(--tenue)}
.p-oro{background:var(--oro-fondo);color:var(--oro-tinta)}
.p-chat{background:var(--chatarra-fondo);color:var(--chatarra)}

/* mapa del método */
.mapa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.momento{border:1px solid var(--pelo);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.momento .q{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--tinta-2)}
.momento .t{font-weight:800;letter-spacing:-.3px;font-size:15px}
.estaciones{display:flex;flex-wrap:wrap;gap:6px}
.estacion{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:999px;background:var(--gris-fondo);font-size:12.5px;font-weight:600;text-decoration:none;color:var(--tinta)}
.estacion b{font-family:var(--mono);font-weight:600;color:var(--tenue)}
.estacion:hover{background:var(--oro-fondo)}
.momento .sale{font-size:12.5px;color:var(--tenue)}
.momento .sale strong{color:var(--tinta)}

/* rejilla de la hoja */
.rejilla{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.bloque{border-top:2px solid var(--tinta);padding-top:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.bloque h2{font-size:19px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.bloque .sub{font-size:13px;color:var(--tenue)}
.c-5{grid-column:span 5}.c-7{grid-column:span 7}.c-4{grid-column:span 4}.c-6{grid-column:span 6}.c-8{grid-column:span 8}.c-12{grid-column:span 12}

/* veredicto */
.veredicto{font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-1.2px;line-height:1.08}
.veredicto em{font-family:var(--serif);font-style:italic;font-weight:500;color:var(--oro-tinta);letter-spacing:-.5px}
.arreglo{font-size:14px;color:var(--tinta-2);max-width:62ch}

/* embudo */
.embudo{display:flex;flex-direction:column;gap:6px}
.franja{margin:0 auto;border-radius:8px;padding:9px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--gris-fondo);border:1px solid transparent;width:100%}
.franja .nro{font-family:var(--mono);font-size:12px;color:var(--tenue)}
.franja .nom{font-weight:700;font-size:14px;line-height:1.2}
.franja .nom small{display:block;font-weight:400;font-size:12px;color:var(--tenue);font-family:var(--serif);font-style:italic}
.franja .det{font-size:12px;color:var(--tinta-2);text-align:right;line-height:1.35}
.franja[data-estado="pasa"]{background:var(--pasa-fondo)}
.franja[data-estado="tapado"]{background:var(--oro-fondo);border-color:var(--oro)}
.franja[data-estado="no-se-lee"]{background:repeating-linear-gradient(135deg,var(--gris-fondo) 0 8px,transparent 8px 14px);border-color:var(--pelo)}
.franja[data-estado="no-se-lee"] .nom,.franja[data-estado="no-se-lee"] .det{color:var(--tenue)}
.cmp .baja{color:var(--chatarra);font-weight:700}
.cmp .sube{color:var(--pasa);font-weight:700}

/* mentira del promedio */
.dos-num{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cifra{border:1px solid var(--pelo);border-radius:10px;padding:10px 12px}
.cifra .v{font-size:26px;font-weight:800;letter-spacing:-1px}
.cifra .e{font-size:12px;color:var(--tenue)}

/* coronación */
.coronas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cubo{border:1px solid var(--pelo);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cubo .ti{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cubo ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.cubo li{font-size:13.5px;line-height:1.3}
.cubo li .veces{font-family:var(--mono);font-size:11.5px;color:var(--tenue)}
.cubo .vacio{font-size:13px;color:var(--tenue);font-style:italic;font-family:var(--serif)}
.angulos{display:flex;flex-direction:column;gap:6px}
.ang{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--pelo)}
.ang:last-child{border-bottom:0}
.ang .p{font-weight:700}
.ang .r{color:var(--tinta-2)}
.ang .r i{color:var(--tenue);font-family:var(--serif)}

/* reparto */
.barra{display:flex;height:46px;border-radius:10px;overflow:hidden;border:1px solid var(--pelo)}
.barra div{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;min-width:0;white-space:nowrap}
.b-rep{background:var(--tinta);color:var(--hoja)}
.b-var{background:var(--oro);color:#050509}
.b-apo{background:var(--gris-fondo);color:var(--tinta)}
.leyenda-barra{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12.5px;color:var(--tinta-2)}
.leyenda-barra b{display:block;color:var(--tinta);font-size:13px}

.conclusiones{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:c}
.conclusiones li{display:grid;grid-template-columns:28px 1fr;gap:8px;counter-increment:c}
.conclusiones li::before{content:counter(c);font-family:var(--serif);font-style:italic;font-size:24px;line-height:1;color:var(--oro-tinta)}
.conclusiones b{display:block;font-size:14.5px;letter-spacing:-.2px}
.conclusiones span{font-size:13.5px;color:var(--tinta-2)}
.ev{font-family:var(--mono);font-size:11.5px;color:var(--tenue)}

.semana{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.semana li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.semana li::before{content:"";flex:0 0 16px;height:16px;margin-top:2px;border:1.5px solid var(--tinta);border-radius:4px}

/* las 3 conclusiones fijas */
.fijas-cab{display:flex;flex-direction:column;gap:4px}
.fijas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fija{border:1px solid var(--pelo);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.fija.gana{border-color:var(--oro);box-shadow:inset 0 3px 0 var(--oro)}
.fija .fq{font-size:11.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--tenue)}
.fija .fr{font-family:var(--serif);font-style:italic;font-size:23px;line-height:1.15;letter-spacing:-.5px;overflow-wrap:anywhere}
.fija .fr small{display:block;font-size:15px;margin-top:2px}
.fija .fcat{font-size:12.5px;color:var(--tenue)}
.fija .fcat b{color:var(--tinta);font-weight:700}
.fija .fn{font-family:var(--mono);font-size:12px;line-height:1.45;color:var(--tinta-2)}
.fija .ft{font-size:13.5px;color:var(--tinta-2)}
.fija .fx{font-size:12.5px;color:var(--tenue)}
.refs{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.ref{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--pelo);border-radius:8px;padding:3px 9px 3px 3px;font-family:var(--mono);font-size:11.5px;color:var(--tinta-2);text-decoration:none;min-height:38px}
.ref:hover{border-color:var(--tinta)}
.ref img{width:32px;height:32px;object-fit:cover;border-radius:5px;display:block}
.ref .sinfoto{width:32px;height:32px;border-radius:5px;background:var(--gris-fondo)}

/* tu data */
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.dato{border:1px solid var(--pelo);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dato[data-estado="sin-dato"]{border-color:var(--chatarra)}
.dato .ti{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dato .ti b{font-size:15px}
.dato .riel{height:10px;border-radius:5px;background:var(--gris-fondo);overflow:hidden}
.dato .riel i{display:block;height:100%;background:var(--pasa)}
.dato p{font-size:13.5px;color:var(--tinta-2)}
.dato .desb{font-family:var(--serif);font-style:italic;color:var(--tinta)}
.dato .refs{margin-top:0}
.dato .ref{min-height:34px;padding:2px 8px 2px 2px}
.dato .ref img,.dato .ref .sinfoto{width:28px;height:28px}

/* calendario con detalle */
.semana-cal{display:flex;flex-direction:column;gap:10px}
.semana-cal>h3{font-size:15px;font-weight:800;letter-spacing:-.2px;border-bottom:1px solid var(--pelo);padding-bottom:6px}
.piezas{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.pieza{border:1px solid var(--pelo);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:9px;min-width:0}
.pieza[data-sale="REPETIR"]{border-color:var(--tinta)}
.pz-cab{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.pz-tema{font-size:16.5px;font-weight:700;letter-spacing:-.3px;line-height:1.25}
.chip.viral{border-color:var(--oro);background:var(--oro-fondo);color:var(--oro-tinta);font-weight:700}
.chip.vende{border-color:var(--pasa);background:var(--pasa-fondo);color:var(--pasa);font-weight:700}
.pz-angulo{font-size:13.5px;color:var(--tinta-2)}
.pz-caja{background:var(--gris-fondo);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.pz-caja .caja-t,.pz-t{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--tenue)}
.pz-gancho{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.35}
.pz-pantalla{font-size:12.5px;color:var(--tinta-2)}
.pz-estructura{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.pz-estructura li::marker{font-family:var(--mono);font-size:12px;color:var(--tenue)}
.pz-cta{font-size:13.5px}
.pz-ref{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start;border:1px dashed var(--pelo-fuerte);border-radius:10px;padding:8px}
.pz-ref.bib{grid-template-columns:1fr}
.pz-ref img,.pz-ref .sinfoto{width:64px;height:80px;object-fit:cover;border-radius:6px;display:block;background:var(--gris-fondo)}
.pz-ref p{font-size:13px;color:var(--tinta-2)}
.pz-ref a{font-size:12px;color:var(--tenue)}
.pz-meta{font-size:12.5px;font-family:var(--mono);color:var(--pasa)}
.pieza .porque{font-size:12.5px;color:var(--tenue);border-top:1px solid var(--pelo);padding-top:8px;margin-top:auto}

/* clase: ranking de ángulos */
.rank-ang{display:flex;flex-direction:column;gap:6px}
.rank-ang .fila{display:grid;grid-template-columns:minmax(90px,150px) 1fr 70px;gap:10px;align-items:center;font-size:13px}
.rank-ang .riel{position:relative;height:14px;border-radius:4px;background:var(--gris-fondo)}
.rank-ang .riel i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--pelo-fuerte)}
.rank-ang .fila.gana .riel i{background:var(--oro)}
.rank-ang .riel em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tinta)}
.rank-ang b{font-family:var(--mono);font-size:12px;text-align:right}

/* ── ANEXOS ── */
.anexo{background:var(--hoja);border:1px solid var(--pelo);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:16px}
.anexo>header{display:flex;flex-direction:column;gap:6px;max-width:72ch}
.anexo h2{font-size:clamp(22px,2.6vw,28px);font-weight:800;letter-spacing:-1px;line-height:1.1}
.anexo h2 .ser{font-weight:500}
.anexo header p{color:var(--tinta-2)}

.lienzo-pend{overflow-x:auto}
.lienzo-pend svg{display:block;min-width:560px;width:100%;max-width:900px;margin:0 auto;height:auto}

.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.video{border:1px solid var(--pelo);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.video[data-zona="ORO"]{border-color:var(--oro)}
.video .foto{position:relative;aspect-ratio:16/10;background:var(--gris-fondo);overflow:hidden;max-width:100%}
.video .foto img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.video .foto .nro{position:absolute;left:8px;top:8px;background:rgba(5,5,9,.78);color:#F4F1EA;font-family:var(--mono);font-size:12px;padding:2px 7px;border-radius:6px}
.video .foto .z{position:absolute;right:8px;top:8px}
.video .cuerpo{padding:10px 12px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
.video .gancho{font-family:var(--serif);font-style:italic;font-size:14.5px;line-height:1.35}
.video .idea{font-size:12.5px;color:var(--tenue)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--pelo-fuerte);color:var(--tinta-2)}
.chip.f{border-color:var(--tinta);color:var(--tinta);font-weight:600}
.video dl{margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-top:1px solid var(--pelo);padding-top:8px;margin-top:auto}
.video dt{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--tenue)}
.video dd{margin:0;font-weight:700;font-size:13px}
.video dd.clave{color:var(--oro-tinta)}
.video a.ver{font-size:12px;color:var(--tenue)}

.preguntas{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.preg{border:1px solid var(--pelo);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.preg .tipo{align-self:flex-start}
.preg h3{font-size:16px;font-weight:700;letter-spacing:-.3px;line-height:1.25}
.preg .porque{font-size:13.5px;color:var(--tinta-2)}
.preg .destino{font-size:12.5px;color:var(--tenue);font-family:var(--serif);font-style:italic}
.respuesta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.respuesta button{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--pelo-fuerte);background:transparent;cursor:pointer;font-size:13px;font-weight:600}
.respuesta button[aria-pressed="true"]{background:var(--tinta);color:var(--hoja);border-color:var(--tinta)}

.tabla-env{overflow-x:auto;border:1px solid var(--pelo);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--tenue);text-align:left;padding:10px 12px;border-bottom:1px solid var(--pelo);white-space:nowrap;background:var(--gris-fondo)}
td{padding:10px 12px;border-bottom:1px solid var(--pelo);vertical-align:top}
tr:last-child td{border-bottom:0}
td.porque{color:var(--tinta-2);min-width:240px}
td .tema{font-weight:600}

.ganchos{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.gancho-var{border:1px solid var(--pelo);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px}
.gancho-var .l{font-family:var(--mono);font-weight:600;color:var(--oro-tinta)}
.gancho-var p{font-family:var(--serif);font-style:italic;font-size:15px}

.glosario{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0 24px}
.glosario div{padding:10px 0;border-bottom:1px solid var(--pelo)}
.glosario dt{font-weight:700;font-size:14px}
.glosario dd{margin:2px 0 0;font-size:13.5px;color:var(--tinta-2)}
.pie{font-size:12.5px;color:var(--tenue);max-width:90ch}


/* ══ vistas: clase · hoja · flashcards · examen ══ */
#app{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.envoltura-hoja{display:flex;flex-direction:column;gap:28px}
.vistas{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:var(--hoja);border:1px solid var(--pelo);border-radius:999px;align-self:flex-start;max-width:100%}
.vistas button{min-height:40px;padding:0 16px;border-radius:999px;border:0;background:transparent;cursor:pointer;font-weight:700;font-size:14px;color:var(--tinta-2)}

function metaDe(filtroTxt){
  var n=parseInt(String(filtroTxt||""),10), cols=META_FILTRO[n]; if(!cols||!R.medianas) return "";

}

(function(){
  var rk=R.ranking, n=rk.length; if(!n) return;
  var W=760, top=34, fila=18, H=top+n*fila+16, xL=150, xR=W-150;
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Puesto por vistas contra puesto por '+esc(R.orden.etiqueta)+'">';
  s+='<text x="'+xL+'" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="var(--tenue)">PUESTO POR VISTAS</text>';
  s+='<text x="'+xR+'" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="var(--tenue)">PUESTO POR '+esc(R.orden.etiqueta.toUpperCase().slice(0,34))+'</text>';
  var y=function(pos){return top+(pos-1)*fila+fila/2;};
  var orden=rk.slice().sort(function(a,b){ var za=a.zona==="TIBIO"?0:1, zb=b.zona==="TIBIO"?0:1; return za-zb; });
  orden.forEach(function(r){
    if(!r.posVistas) return;
    var col = r.zona==="ORO"?"var(--oro)":r.zona==="CHATARRA"?"var(--chatarra)":"var(--pelo-fuerte)";
    var gros = r.zona==="TIBIO"?1:2.2;
    s+='<line x1="'+(xL+8)+'" y1="'+y(r.posVistas)+'" x2="'+(xR-8)+'" y2="'+y(r.posFiltro)+'" stroke="'+col+'" stroke-width="'+gros+'" fill="none"/>';
  });
  rk.forEach(function(r){
    if(!r.posVistas) return;
    s+='<text x="'+(xL-4)+'" y="'+(y(r.posVistas)+4)+'" text-anchor="end" font-size="11.5" fill="var(--tinta-2)" font-family="Geist Mono, monospace">#'+r.n+' · '+fmt(r.vistas,0)+'</text>';

function cubetasDe(total,p){
  var ks=["rep","var_","apo"], ex=ks.map(function(k){return {k:k,x:total*p[k]/100};}), b={};
  ex.forEach(function(e){b[e.k]=Math.floor(e.x);});
  var falta=total-b.rep-b.var_-b.apo;
  ex.slice().sort(function(a,c){return (c.x-Math.floor(c.x))-(a.x-Math.floor(a.x));}).forEach(function(e){ if(falta>0&&p[e.k]>0){b[e.k]++;falta--;} });
  return b;
}

function irVista(v, ancla){
  document.querySelectorAll("[data-vista]").forEach(function(b){ b.setAttribute("aria-selected", b.dataset.vista===v?"true":"false"); });
  document.querySelectorAll("[data-vista-panel]").forEach(function(p){ p.hidden = p.dataset.vistaPanel!==v; });
  try{ localStorage.setItem("f100k-vista", v); }catch(e){}
  if(ancla){ var el=document.getElementById(ancla); if(el) el.scrollIntoView({block:"start"}); } else window.scrollTo(0,0);
}
function irSub(s){
  document.querySelectorAll(".subtabs [data-sub]").forEach(function(b){ b.setAttribute("aria-selected", b.dataset.sub===s?"true":"false"); });
  document.querySelectorAll("[data-panel]").forEach(function(p){ p.hidden = p.dataset.panel!==s; });
  var t=document.querySelector(".subtabs"); if(t) t.scrollIntoView({block:"start"});
}
var fcI=0;
function pintarFC(){ var c=CARDS[fcI]; document.getElementById("fc-tag").textContent=c[0]; document.getElementById("fc-q").textContent=c[1]; document.getElementById("fc-a").textContent=c[2]; document.getElementById("fc-cont").textContent=(fcI+1)+" / "+CARDS.length; document.getElementById("flip-inner").classList.remove("is-flipped"); }
pintarFC();
var aciertos={};
document.addEventListener("click",function(e){
  var b;
  if((b=e.target.closest("[data-vista]"))){ irVista(b.dataset.vista); return; }
  if((b=e.target.closest("[data-ir]"))){ e.preventDefault(); var p=b.dataset.ir.split(":"); if(p[0]==="clase"){ irVista("clase"); irSub(p[1]); } else irVista(p[0], p[1]); return; }
  if((b=e.target.closest("[data-sub]"))){ irSub(b.dataset.sub); return; }
  if((b=e.target.closest("[data-filtro]"))){ var n=+b.dataset.filtro; document.querySelectorAll("[data-filtro]").forEach(function(x){x.setAttribute("aria-selected", x===b?"true":"false");}); document.getElementById("panel-filtro").innerHTML=panelFiltro(n); return; }
  if((b=e.target.closest("[data-mezcla]"))){ document.querySelectorAll("[data-mezcla]").forEach(function(x){x.setAttribute("aria-pressed", x===b?"true":"false");}); document.getElementById("mezcla-demo").innerHTML=barraMezcla(+b.dataset.mezcla); return; }
  if(e.target.closest("#flip")){ document.getElementById("flip-inner").classList.toggle("is-flipped"); return; }
  if(e.target.closest("#fc-prev")){ fcI=(fcI+CARDS.length-1)%CARDS.length; pintarFC(); return; }
  if(e.target.closest("#fc-next")){ fcI=(fcI+1)%CARDS.length; pintarFC(); return; }
  if((b=e.target.closest("[data-op]"))){
    var i=+b.dataset.caso, j=+b.dataset.op, ex=EXAM[i], caso=b.closest(".caso");
    caso.querySelectorAll("[data-op]").forEach(function(x){ var k=+x.dataset.op; x.disabled=true; if(k===ex.c) x.classList.add("bien"); else if(k===j) x.classList.add("mal"); });
    var w=caso.querySelector(".why"); w.hidden=false; w.textContent=(j===ex.c?"Correcto. ":"No es esa. ")+ex.why;
    aciertos[i]=(j===ex.c);
    var hechos=Object.keys(aciertos).length, ok=Object.keys(aciertos).filter(function(k){return aciertos[k];}).length;
    document.getElementById("puntaje").textContent=ok+" de "+hechos+" correctos"+(hechos===EXAM.length?(ok===EXAM.length?" · Dominas el método.":" · Repasa La clase y vuelve a intentarlo."):"");
  }
});

function copiar(t,msg){
  function ok(){ aviso.textContent=msg; }
  function legacy(){ try{ var ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); ok(); }catch(e){ aviso.textContent="No se pudo copiar: selecciona el texto a mano."; } }
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok,legacy); else legacy();
}
